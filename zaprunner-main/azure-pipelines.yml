
trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  nodeVersion: '22.x'
  appDir: 'zaprunner-main'
  artifactName: 'webapp'
  azureServiceConnection: 'azure-service-connection'
  appName: 'mi-aplicacion-azure'
  stagingSlot: 'staging'

stages:
  # 1. TEST: validar antes de empaquetar
  - stage: Test
    displayName: 'Pruebas y calidad'
    jobs:
      - job: AutomatedTests
        displayName: 'Ejecutar tests'
        steps:
          - task: UseNode@1
            inputs:
              version: $(nodeVersion)

          - script: npm install -g pnpm@10
            displayName: 'Instalar pnpm'

          - script: pnpm install --frozen-lockfile
            displayName: 'Instalar dependencias'
            workingDirectory: $(appDir)

          - script: pnpm run --if-present lint
            displayName: 'Validar calidad del código'
            workingDirectory: $(appDir)

          - script: pnpm run --if-present test
            displayName: 'Ejecutar pruebas automatizadas'
            workingDirectory: $(appDir)

          - script: pnpm run build
            displayName: 'Verificar compilación'
            workingDirectory: $(appDir)

  # 2. BUILD: crear artefacto desplegable
  - stage: Build
    displayName: 'Construir artefacto'
    dependsOn: Test
    condition: succeeded()
    jobs:
      - job: Package
        steps:
          - task: UseNode@1
            inputs:
              version: $(nodeVersion)

          - script: |
              npm install -g pnpm@10
              pnpm install --frozen-lockfile
              pnpm run build
            displayName: 'Preparar aplicación'
            workingDirectory: $(appDir)

          - task: ArchiveFiles@2
            displayName: 'Crear paquete ZIP'
            inputs:
              rootFolderOrFile: '$(Build.SourcesDirectory)/$(appDir)'
              includeRootFolder: false
              archiveType: zip
              archiveFile: '$(Build.ArtifactStagingDirectory)/app.zip'
              replaceExistingArchive: true

          - publish: '$(Build.ArtifactStagingDirectory)/app.zip'
            artifact: $(artifactName)
            displayName: 'Publicar artefacto'

