
trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  nodeVersion: '20.x'
  artifactName: 'webapp'
  azureServiceConnection: 'azure-service-connection'
  appName: 'mi-aplicacion-azure'
  stagingSlot: 'staging'

stages:
  # 1. TEST: validar antes de empaquetar
  - stage: Test
    displayName: 'Pruebas y calidad'
    jobs:
      - job: AutomatedTests
        displayName: 'Ejecutar tests'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)

          - script: npm ci
            displayName: 'Instalar dependencias'

          - script: npm run lint
            displayName: 'Validar calidad del código'

          - script: npm test -- --coverage
            displayName: 'Ejecutar pruebas automatizadas'

          - script: npm run build
            displayName: 'Verificar compilación'

  # 2. BUILD: crear artefacto desplegable
  - stage: Build
    displayName: 'Construir artefacto'
    dependsOn: Test
    condition: succeeded()
    jobs:
      - job: Package
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)

          - script: |
              npm ci
              npm run build
            displayName: 'Preparar aplicación'

          - task: ArchiveFiles@2
            displayName: 'Crear paquete ZIP'
            inputs:
              rootFolderOrFile: '$(Build.SourcesDirectory)'
              includeRootFolder: false
              archiveType: zip
              archiveFile: '$(Build.ArtifactStagingDirectory)/app.zip'
              replaceExistingArchive: true

          - publish: '$(Build.ArtifactStagingDirectory)/app.zip'
            artifact: $(artifactName)
            displayName: 'Publicar artefacto'

  # 3. DEPLOY: desplegar solo si Test y Build pasan
  - stage: DeployStaging
    displayName: 'Desplegar en staging'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployWeb
        environment: 'webapp-staging'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: $(artifactName)

                - task: AzureWebApp@1
                  displayName: 'Desplegar en Azure App Service'
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    appType: webAppLinux
                    appName: $(appName)
                    deployToSlotOrASE: true
                    resourceGroupName: 'mi-resource-group'
                    slotName: $(stagingSlot)
                    package: '$(Pipeline.Workspace)/$(artifactName)/app.zip'

                - script: |
                    set -e
                    for i in $(seq 1 12); do
                      if curl -fsS "$(STAGING_URL)/health"; then
                        echo "Smoke test exitoso"
                        exit 0
                      fi
                      echo "Aplicación aún no disponible. Intento $i/12"
                      sleep 10
                    done
                    echo "Falló el smoke test"
                    exit 1
                  displayName: 'Smoke test HTTP'
                  env:
                    STAGING_URL: $(stagingUrl)
